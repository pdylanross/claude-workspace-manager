# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: cwm

builds:
  - id: cwm
    main: ./cmd/cwm
    binary: cwm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: pdylanross
    name: claude-workspace-manager
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
