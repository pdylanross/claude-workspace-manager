name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run unit tests
        run: go test -v ./... -race

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

  # Everything below runs only for a push to main, and only once the three jobs
  # above have passed. A prerelease is cut from the commits since the last real
  # release; the promotion that turns it into one waits for a human.
  prerelease:
    name: Prerelease
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two pushes racing would compute the same tag, so cutting is serialised.
    # Never cancelled: a half-written release is worse than a slow queue.
    concurrency:
      group: cut-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the plan is computed from the commits since the
          # last release tag, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Work out the next prerelease
        id: plan
        # Writes "tag=vX.Y.Z-preN" when there is something to cut and nothing at
        # all when there is not, which leaves the output empty and skips the
        # rest.
        run: go run ./cmd/release plan >> "$GITHUB_OUTPUT"

      - name: Tag it
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Release it
        if: steps.plan.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Say which tag outright rather than letting goreleaser work it out.
          # See the promote job for what happens when it works it out wrongly.
          GORELEASER_CURRENT_TAG: ${{ steps.plan.outputs.tag }}

  # Gated on the "release" environment, which carries the required reviewer.
  # The job's "if" is evaluated before the gate, so a push that cut no
  # prerelease queues no approval at all.
  promote:
    name: Promote
    needs: [prerelease]
    if: needs.prerelease.outputs.tag != ''
    runs-on: ubuntu-latest
    # Cancelled by the next one, unlike cutting. A job parked on an approval is
    # "in progress", so a newer prerelease withdraws the older prerelease's
    # request rather than leaving a queue of stale approvals to reject by hand.
    # Approving is always approving the newest thing on main.
    concurrency:
      group: promote-release-${{ github.ref }}
      cancel-in-progress: true
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Work out what to promote
        id: promote
        # Reports the source prerelease as well as the target, because main may
        # have moved on while this waited for approval.
        run: go run ./cmd/release promote >> "$GITHUB_OUTPUT"

      - name: Tag the release at the commit that was tested
        if: steps.promote.outputs.tag != ''
        env:
          TAG: ${{ steps.promote.outputs.tag }}
          SOURCE: ${{ steps.promote.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SOURCE^{commit}"
          git push origin "$TAG"
          # goreleaser builds the working tree, so move it to the tag rather
          # than releasing whatever main has become since.
          git checkout --detach "$TAG"

      - name: Release it
        if: steps.promote.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Load bearing. A promotion puts two tags on one commit, and asked to
          # work out which it is on, goreleaser picks the prerelease: it sorts
          # the tags with git's version sort, which knows nothing about semver
          # prereleases and so ranks v0.1.0-pre1 above v0.1.0. The result is a
          # promotion that quietly re-releases the prerelease it was promoting.
          GORELEASER_CURRENT_TAG: ${{ steps.promote.outputs.tag }}
