name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Releases are cut from tags, and two pushes racing would compute the same one.
# Never cancel in progress: a half-finished release is worse than a slow queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run unit tests
        run: go test -v ./... -race

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

  # Runs only for a push to main, and only once the three jobs above have
  # passed. Promotion to a real release is the separate Promote workflow, run by
  # hand.
  prerelease:
    name: Prerelease
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the plan is computed from the commits since the
          # last release tag, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Work out the next prerelease
        id: plan
        # Writes "tag=vX.Y.Z-preN" when there is something to cut and nothing at
        # all when there is not, which leaves the output empty and skips the
        # rest.
        run: go run ./cmd/release plan >> "$GITHUB_OUTPUT"

      - name: Tag it
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Release it
        if: steps.plan.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
