name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Releases are cut from tags, and two pushes racing would compute the same one.
# Never cancel in progress: a half-finished release is worse than a slow queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run unit tests
        run: go test -v ./... -race

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

  # Everything below runs only for a push to main, and only once the three jobs
  # above have passed. A prerelease is cut from the commits since the last real
  # release; the promotion that turns it into one waits for a human.
  prerelease:
    name: Prerelease
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the plan is computed from the commits since the
          # last release tag, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Work out the next prerelease
        id: plan
        # Writes "tag=vX.Y.Z-preN" when there is something to cut and nothing at
        # all when there is not, which leaves the output empty and skips the
        # rest.
        run: go run ./cmd/release plan >> "$GITHUB_OUTPUT"

      - name: Tag it
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Release it
        if: steps.plan.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gated on the "release" environment, which carries the required reviewer.
  # The job's "if" is evaluated before the gate, so a push that cut no
  # prerelease queues no approval.
  promote:
    name: Promote
    needs: [prerelease]
    if: needs.prerelease.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Work out what to promote
        id: promote
        # Reports the source prerelease as well as the target, because main may
        # have moved on while this waited for approval.
        run: go run ./cmd/release promote >> "$GITHUB_OUTPUT"

      - name: Tag the release at the commit that was tested
        if: steps.promote.outputs.tag != ''
        env:
          TAG: ${{ steps.promote.outputs.tag }}
          SOURCE: ${{ steps.promote.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SOURCE^{commit}"
          git push origin "$TAG"
          # goreleaser builds the working tree, so move it to the tag rather
          # than releasing whatever main has become since.
          git checkout --detach "$TAG"

      - name: Release it
        if: steps.promote.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
